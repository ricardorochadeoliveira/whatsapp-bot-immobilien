<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Firmen-Portal - meinwohntraum.ai</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f0f2f5; color: #1b2430; padding: 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; }
  .card { background: #fff; border: 1px solid #d1d7db; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #555; margin-top: 10px; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px; font-size: 14px; }
  button { margin-top: 14px; padding: 8px 16px; border: none; border-radius: 6px; background: #075e54; color: #fff; cursor: pointer; font-size: 14px; }
  button.secondary { background: #888; margin-left: 8px; }
  .error { color: #b00020; font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .info { color: #075e54; font-size: 13px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; }
  .status-aktiv { color: #3e5c4e; font-weight: 600; }
  .status-deaktiviert { color: #999; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  #dashboard { display: none; }
  #authForms { display: block; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .checkbox-row input { width: auto; margin-top: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>meinwohntraum.ai - Firmen-Portal</h1>

  <div id="authForms">
    <div class="card">
      <h2>Login</h2>
      <label>E-Mail <input id="login_email" type="email"></label>
      <label>Passwort <input id="login_password" type="password"></label>
      <button onclick="login()">Einloggen</button>
      <div id="loginError" class="error"></div>
    </div>

    <div class="card">
      <h2>Registrieren</h2>
      <label>Firmenname <input id="signup_name"></label>
      <label>E-Mail <input id="signup_email" type="email"></label>
      <label>Passwort <input id="signup_password" type="password"></label>
      <button onclick="signup()">Firma registrieren</button>
      <div id="signupError" class="error"></div>
      <div id="signupInfo" class="info"></div>
    </div>
  </div>

  <div id="dashboard">
    <div class="card topbar">
      <div>Eingeloggt als <strong id="firmaName"></strong></div>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Neues Inserat</h2>
      <label>Titel <input id="f_titel"></label>
      <div class="row">
        <div><label>Typ
          <select id="f_typ"><option value="miete">Miete</option><option value="kauf">Kauf</option></select>
        </label></div>
        <div><label>Objektart <input id="f_objekttyp" value="Wohnung"></label></div>
      </div>
      <div class="row">
        <div><label>Zimmer <input id="f_zimmer" type="number" step="0.5" value="3"></label></div>
        <div><label>Fläche m2 <input id="f_flaeche" type="number" value="70"></label></div>
        <div><label>Preis CHF <input id="f_preis" type="number" value="2000"></label></div>
      </div>
      <div class="row">
        <div><label>Kanton <input id="f_kanton"></label></div>
        <div><label>Ort <input id="f_ort"></label></div>
      </div>
      <label>Beschreibung <textarea id="f_beschreibung" rows="2"></textarea></label>
      <div class="checkbox-row"><input id="f_garten" type="checkbox"><label style="margin:0">Garten vorhanden</label></div>
      <button onclick="createInserat()">Inserat einstellen</button>
      <div id="inseratError" class="error"></div>
    </div>

    <div class="card">
      <h2>Meine Inserate</h2>
      <button onclick="loadInserate()">Aktualisieren</button>
      <table id="inserateTable">
        <thead><tr><th>Titel</th><th>Ort</th><th>Zi.</th><th>CHF</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Leads (Interessenten aus dem WhatsApp-Chat)</h2>
      <button onclick="loadLeads()">Aktualisieren</button>
      <table id="leadsTable">
        <thead><tr><th>Inserat</th><th>Status</th><th>Erhalten am</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function token() { return localStorage.getItem('firma_token'); }

async function login() {
  const email = document.getElementById('login_email').value;
  const password = document.getElementById('login_password').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const res = await fetch('/api/firma/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.detail || 'Login fehlgeschlagen.'; return; }
  localStorage.setItem('firma_token', data.access_token);
  showDashboard(data.firma);
}

async function signup() {
  const name = document.getElementById('signup_name').value;
  const email = document.getElementById('signup_email').value;
  const password = document.getElementById('signup_password').value;
  const errEl = document.getElementById('signupError');
  const infoEl = document.getElementById('signupInfo');
  errEl.textContent = ''; infoEl.textContent = '';
  const res = await fetch('/api/firma/signup', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, email, password})
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.detail || 'Registrierung fehlgeschlagen.'; return; }
  infoEl.textContent = 'Registriert. Falls E-Mail-Bestaetigung aktiv ist, zuerst die Bestaetigungsmail bestaetigen, dann einloggen.';
}

function logout() {
  localStorage.removeItem('firma_token');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('authForms').style.display = 'block';
}

async function showDashboard(firma) {
  document.getElementById('authForms').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('firmaName').textContent = firma.name + ' (' + firma.email + ')';
  await loadInserate();
  await loadLeads();
}

async function authFetch(url, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, {'Authorization': 'Bearer ' + token()});
  return fetch(url, options);
}

async function createInserat() {
  const body = {
    titel: document.getElementById('f_titel').value,
    beschreibung: document.getElementById('f_beschreibung').value || null,
    typ: document.getElementById('f_typ').value,
    objekttyp: document.getElementById('f_objekttyp').value,
    zimmer: parseFloat(document.getElementById('f_zimmer').value),
    flaeche_m2: parseFloat(document.getElementById('f_flaeche').value),
    preis: parseInt(document.getElementById('f_preis').value, 10),
    kanton: document.getElementById('f_kanton').value,
    ort: document.getElementById('f_ort').value,
    hat_garten: document.getElementById('f_garten').checked
  };
  const errEl = document.getElementById('inseratError');
  errEl.textContent = '';
  const res = await authFetch('/api/firma/inserate', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.detail || 'Fehler beim Erstellen.'; return; }
  loadInserate();
}

let inserateById = {};

function td(text) {
  const cell = document.createElement('td');
  cell.textContent = text;
  return cell;
}

async function loadInserate() {
  const res = await authFetch('/api/firma/inserate');
  if (!res.ok) return;
  const items = await res.json();
  inserateById = Object.fromEntries(items.map(i => [i.id, i]));
  const tbody = document.querySelector('#inserateTable tbody');
  tbody.innerHTML = '';
  for (const i of items) {
    const tr = document.createElement('tr');
    const nextStatus = i.status === 'aktiv' ? 'deaktiviert' : 'aktiv';
    tr.appendChild(td(i.titel));
    tr.appendChild(td(`${i.ort}, ${i.kanton}`));
    tr.appendChild(td(i.zimmer));
    tr.appendChild(td(i.preis));
    const statusCell = td(i.status);
    statusCell.className = `status-${i.status}`;
    tr.appendChild(statusCell);

    const actionCell = document.createElement('td');
    const btn = document.createElement('button');
    btn.className = 'secondary';
    btn.textContent = nextStatus === 'aktiv' ? 'Aktivieren' : 'Deaktivieren';
    btn.addEventListener('click', () => toggleStatus(i.id, nextStatus));
    actionCell.appendChild(btn);
    tr.appendChild(actionCell);

    tbody.appendChild(tr);
  }
}

async function toggleStatus(id, status) {
  await authFetch(`/api/firma/inserate/${id}/status`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status})
  });
  loadInserate();
}

async function loadLeads() {
  const res = await authFetch('/api/firma/leads');
  if (!res.ok) return;
  const items = await res.json();
  const tbody = document.querySelector('#leadsTable tbody');
  tbody.innerHTML = '';
  for (const l of items) {
    const titel = inserateById[l.immobilie_id] ? inserateById[l.immobilie_id].titel : l.immobilie_id;
    const tr = document.createElement('tr');
    tr.appendChild(td(titel));
    tr.appendChild(td(l.status));
    tr.appendChild(td(l.erstellt_am));
    tbody.appendChild(tr);
  }
}

// Beim Laden pruefen, ob schon eingeloggt
(async function init() {
  if (!token()) return;
  const res = await authFetch('/api/firma/me');
  if (res.ok) showDashboard(await res.json());
  else localStorage.removeItem('firma_token');
})();
</script>
</body>
</html>
